<html>
<head>
    <base href="https://example.com/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Screen Share Room with High-Quality Audio</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            background-color: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        #header {
            background-color: #2c2c2c;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #peers {
            display: flex;
            gap: 10px;
        }
        .peer {
            display: flex;
            align-items: center;
            background-color: #3a3a3a;
            padding: 5px 10px;
            border-radius: 15px;
        }
        .peer img {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            margin-right: 5px;
        }
        #main-content {
            flex-grow: 1;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            gap: 20px;
        }
        .ascii-container {
            white-space: pre;
            font-size: 4px;
            line-height: 1;
            background-color: #000;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            position: relative;
        }
        .colored-ascii {
            white-space: pre;
            line-height: 1;
        }
        #controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            max-width: 90%;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        button:disabled {
            background-color: #cccc;
            cursor: not-allowed;
        }
        #volume-control, #image-controls, #detail-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 5px;
        }
        .peer-volume-control {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 5px;
        }
        .peer-volume-control label, #image-controls label, #detail-controls label {
            font-size: 12px;
        }
        .peer-volume-control input[type="range"], #image-controls input[type="range"], #detail-controls input[type="range"] {
            width: 100px;
            -webkit-appearance: none;
            background: #ddd;
            outline: none;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        .peer-volume-control input[type="range"]:hover, #image-controls input[type="range"]:hover, #detail-controls input[type="range"]:hover {
            opacity: 1;
        }
        .peer-volume-control input[type="range"]:hover::-webkit-slider-thumb, #image-controls input[type="range"]:hover::-webkit-slider-thumb, #detail-controls input[type="range"]:hover::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 15px;
            height: 15px;
            background: #4CAF50;
            cursor: pointer;
            border-radius: 50%;
        }
        .peer-volume-control input[type="range"]::-moz-range-thumb, #image-controls input[type="range"]::-moz-range-thumb, #detail-controls input[type="range"]::-moz-range-thumb {
            width: 15px;
            height: 15px;
            background: #4CAF50;
            cursor: pointer;
            border-radius: 50%;
        }
        .toggle-container {
            display: flex;
            align-items: center;
            margin: 5px;
        }
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
            margin: 0 10px;
        }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .toggle-slider {
            background-color: #4CAF50;
        }
        input:checked + .toggle-slider:before {
            transform: translateX(26px);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
</head>
<body>
    <div id="header">
        <h1>ASCII Screen Share Room with High-Quality Audio</h1>
        <div id="peers"></div>
    </div>
    <div id="main-content"></div>
    <div id="controls">
        <button id="start-btn">Start Sharing</button>
        <button id="stop-btn" disabled>Stop Sharing</button>
        <div id="volume-control">
            <label for="volume">Master Volume:</label>
            <input type="range" id="volume" min="0" max="1" step="0.1" value="1">
        </div>
        <div id="image-controls">
            <div class="control-group">
                <label for="brightness">Brightness:</label>
                <input type="range" id="brightness" min="0" max="2" step="0.1" value="1">
            </div>
            <div class="control-group">
                <label for="contrast">Contrast:</label>
                <input type="range" id="contrast" min="0" max="2" step="0.1" value="1">
            </div>
            <div class="control-group">
                <label for="blur">Blur:</label>
                <input type="range" id="blur" min="0" max="10" step="0.5" value="0">
            </div>
            <div class="control-group">
                <label for="detail-level">Detail Level:</label>
                <input type="range" id="detail-level" min="1" max="4" step="1" value="2">
            </div>
            <div class="control-group">
                <label for="char-density">Character Density:</label>
                <input type="range" id="char-density" min="1" max="5" step="1" value="3">
            </div>
            <div class="toggle-container">
                <span>Color Mode:</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="color-mode">
                    <span class="toggle-slider"></span>
                </label>
            </div>
        </div>
        <div id="detail-controls">
            <div class="control-group">
                <label for="detail-level">Detail Level:</label>
                <input type="range" id="detail-level" min="1" max="4" step="1" value="2">
            </div>
            <div class="control-group">
                <label for="char-density">Character Density:</label>
                <input type="range" id="char-density" min="1" max="5" step="1" value="3">
            </div>
            <div class="toggle-container">
                <span>Color Mode:</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="color-mode">
                    <span class="toggle-slider"></span>
                </label>
            </div>
        </div>
    </div>

<script>
    const room = new WebsimSocket();
    const monochromeAsciiChars = ['@', '#', 'S', '%', '?', '*', '+', ';', ':', ',', '.'];
    const denseAsciiChars = ['█', '▓', '▒', '░', '█', '▓', '▒', '░', '█', '▓', '▒', '░'];
    const sparseAsciiChars = [' ', '.', ':', '-', '=', '+', '*', '#', '%', '@'];
    const audioChars = ' ▁▂▃▄▅▆▇█';
    let isStreaming = false;
    let streamers = new Set();
    let lastFrames = {};

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const masterGainNode = audioCtx.createGain();
    masterGainNode.connect(audioCtx.destination);

    const AUDIO_BUFFER_SIZE = 16384;
    let audioBuffer = [];

    const peerGainNodes = {};

    // Improved stream quality and performance management
    const streamBuffer = {
        frames: [],
        maxSize: 15, // Increased buffer size
        lastSentTime: 0,
        targetInterval: 80, // Decreased target interval for more responsiveness
        adaptiveInterval: 80,
        consecutiveSlowFrames: 0,
        qualityReductionFactor: 1,
        isProcessing: false,
        droppedFrames: 0,
        totalFrames: 0,
        lastAdaptationTime: 0,
        adaptationCooldown: 2000, // 2 seconds cooldown between adaptations
        adaptiveThrottling: false,
        minFrameInterval: 33 // ~30fps max
    };

    // Network performance tracking with improved metrics
    const networkStats = {
        lastSentTime: 0,
        framesSent: 0,
        bytesSent: 0,
        lastNetworkCheckTime: 0,
        averageTransmissionTime: 100,
        transmissionTimes: [],
        maxTransmissionTimes: 30,
        bandwidthEstimate: 0,
        retryCount: 0,
        maxRetries: 5,
        bufferRatio: 0, // Current buffer size / max buffer size
        lastSuccessfulTransmission: 0
    };

    // Settings
    let brightness = 1;
    let contrast = 1;
    let blur = 0;
    let detailLevel = 2;
    let charDensity = 3;
    let colorMode = false;
    let asciiChars = monochromeAsciiChars;

    async function initializeRoom() {
        try {
            await room.initialize();
            
            room.subscribePresence((presence) => {
                updateUI();
            });
            
            room.updatePresence({
                isStreaming: false,
                settings: {
                    brightness,
                    contrast,
                    blur,
                    detailLevel,
                    charDensity,
                    colorMode
                }
            ));
            
            updatePeersUI();
        } catch (error) {
            console.error('Failed to initialize room:', error);
            // Retry connection after a delay
            setTimeout(initializeRoom, 3000);
        }
        
        // Connection state
        let connectionReady = false;
        let pendingOperations = [];

    async function startStreaming() {
        try {
            const stream = await navigator.mediaDevices.getDisplayMedia({
                video: {
                    width: {
                        ideal: 640
                    },
                    height: {
                        ideal: 480
                    },
                    audio: true
                }));
            
            const video = document.createElement('video'));
            video.srcObject = stream;
            await video.play();

            const canvas = document.createElement('canvas'));
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            
            // Adjust canvas size based on detail level
            const baseWidth = 80 * detailLevel;
            const baseHeight = 60 * detailLevel;
            canvas.width = baseWidth;
            canvas.height = baseHeight;

            isStreaming = true;
            
            // Reset stream buffer and network stats
            streamBuffer.frames = [];
            streamBuffer.lastSentTime = 0;
            streamBuffer.adaptiveInterval = streamBuffer.targetInterval;
            streamBuffer.qualityReductionFactor = 1;
            streamBuffer.consecutiveSlowFrames = 0;
            streamBuffer.droppedFrames = 0;
            streamBuffer.totalFrames = 0;
            streamBuffer.lastAdaptationTime = Date.now();
            streamBuffer.adaptiveThrottling = false;
            
            networkStats.framesSent = 0;
            networkStats.bytesSent = 0;
            networkStats.transmissionTimes = [];
            networkStats.lastNetworkCheckTime = Date.now();
            networkStats.retryCount = 0;
            networkStats.bandwidthEstimate = 0;
            networkStats.lastSuccessfulTransmission = Date.now();
            
            const updatePresence = () => {
                room.updatePresence({
                    isStreaming: true,
                    settings: {
                        brightness,
                        contrast,
                        blur,
                        detailLevel,
                        charDensity,
                        colorMode
                    }
                ));
            
            if (connectionReady) {
                updatePresence();
            } else {
                pendingOperations.push(updatePresence));
            }
            
            updateButtons();

            room.send({
                type: 'streamStarted',
                echo: true
            ));

            // Check if stream has audio tracks
            const hasAudio = stream.getAudioTracks().length > 0;
            let audioProcessor = null;
            let audioContext = null;

            if (hasAudio) {
                try {
                    audioContext = new AudioContext();
                    const source = audioContext.createMediaStreamSource(stream);
                    const processor = audioContext.createScriptProcessor(4096, 1, 1);

                    source.connect(processor);
                    processor.connect(audioContext.destination);

                    processor.onaudioprocess = (e) => {
                        const inputData = e.inputBuffer.getChannelData(0);
                        audioBuffer.push(...inputData);
                        
                        if (audioBuffer.length >= AUDIO_BUFFER_SIZE) {
                            captureFrame(video, canvas, ctx, true);
                        }
                    );
                    
                    audioProcessor = processor;
                } catch (error) {
                    console.error('Error setting up audio processing:', error);
                    // Continue without audio if there's an error
                }
            }

         function captureFrame(video, canvas, ctx, withAudio = hasAudio && audioBuffer.length >= AUDIO_BUFFER_SIZE) {
            if (streamBuffer.adaptiveThrottling && streamBuffer.frames.length >= streamBuffer.maxSize * 0.8) {
                return;
            }
            
            // If not enough time has passed since last capture, skip this frame to avoid overwhelming the system
            const now = Date.now();
            if (now - streamBuffer.lastSentTime < streamBuffer.minFrameInterval) {
                return;
            }
            
            // Adjust canvas size if detail level changed, considering quality reduction
            const qualityAdjustedDetailLevel = Math.max(1, Math.min(4, detailLevel / streamBuffer.qualityReductionFactor));
            const newWidth = 80 * qualityAdjustedDetailLevel;
            const newHeight = 60 * qualityAdjustedDetailLevel;
            
            if (canvas.width !== newWidth || canvas.height !== newHeight) {
                canvas.width = newWidth;
                canvas.height = newHeight;
            }
            
            // Apply visual filters based on user settings
            ctx.filter = `brightness(${brightness}}) contrast(${contrast}}) blur(${blur}px)`;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            ctx.filter = 'none';
            
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            
            let audioData = null;
            if (withAudio && audioBuffer.length >= AUDIO_BUFFER_SIZE) {
                audioData = audioBuffer.slice(0, AUDIO_BUFFER_SIZE);
                audioBuffer = audioBuffer.slice(AUDIO_BUFFER_SIZE);
            }
            
            const asciiFrame = getAsciiFrame(imageData, canvas.width, canvas.height, audioData);

            // Queue the frame with current settings
            queueFrame(asciiFrame, withAudio && audioData !== null, {
                brightness,
                contrast,
                blur,
                detailLevel: qualityAdjustedDetailLevel,
                charDensity,
                colorMode
            });
        }
        
        // Adaptive frame capture interval based on network conditions
        let frameInterval;
        let adaptiveFrameRate = () => {
            // Cancel any existing interval
            if (frameInterval) clearInterval(frameInterval));
            
            // Set up a new interval with adaptive timing
            const captureInterval = Math.max(
                streamBuffer.minFrameInterval,
                // More frequent captures when buffer isn't full, less frequent when it's filling up
                streamBuffer.adaptiveInterval * (0.3 + (networkStats.bufferRatio * 0.7))
            );
            
            frameInterval = setInterval(() => {
                if (isStreaming) {
                    captureFrame(video, canvas, ctx, hasAudio && audioBuffer.length >= AUDIO_BUFFER_SIZE);
                } else {
                    clearInterval(frameInterval));
                }
            }, captureInterval);
        };
        
        // Start with initial frame rate
        adaptiveFrameRate();
        
        // Periodically adjust frame rate
        const frameRateAdjuster = setInterval(() => {
            if (isStreaming) {
                adaptiveFrameRate();
            }
        }, 2000));
    }

    function stopStreaming() {
        isStreaming = false;
        
        const updatePresence = () => {
            room.updatePresence({
                isStreaming: false
            });
        };
        
        if (connectionReady) {
            updatePresence();
        } else {
            pendingOperations.push(updatePresence));
        }
        
        updateButtons();
        
        room.send({
            type: 'streamEnded',
            echo: true
        });
    }

    function updateAsciiContainer(clientId, frame, username) {
        let container = document.getElementById(`ascii-${clientId}`);
        if (!container) {
            container = document.createElement('div'));
            container.id = `ascii-${clientId}`);
            container.className = 'ascii-container';
            document.getElementById('main-content').appendChild(container);
        }
        
        const lines = frame.split('\n'));
        // Last line might be metadata
        let metadataStr = lines[lines.length - 1];
        let metadata = {};
        try {
            if (metadataStr.startsWith('{') && metadataStr.endsWith('}'))) {
                metadata = JSON.parse(metadataStr);
                // Remove metadata line from display
                lines.pop();
            }
        } catch (e) {
            console.warn('Failed to parse metadata:', e);
        }
        
        // Check for audio data (second-to-last line if metadata exists)
        const audioDataIndex = lines.length - 1;
        const audioData = lines[audioDataIndex];
        
        if (audioData && audioData.trim() && audioData.includes('▁▂▃▄▅▆▇█')) {
            try {
                const decodedAudio = decodeAudio(audioData);
                if (decodedAudio.length > 0) {
                    playAudio(decodedAudio, clientId);
                }
                // Remove audio line from display
                lines.splice(audioDataIndex, 1));
            } catch (error) {
                console.warn('Error decoding audio:', error);
            }
        }
        
        const displayContent = lines.join('\n'));
        
        // If in color mode, the content will include HTML (from spans)
        if (metadata.colorMode) {
            container.innerHTML = `${username}:<br>${displayContent}`;
        } else {
            // For monochrome, just use text content
            container.textContent = `${username}:\n${displayContent}`;
        }
        
        // Add volume control if not already present
        if (!container.querySelector('.peer-volume-control')) {
            const volumeControl = document.createElement('div'));
            volumeControl.className = 'peer-volume-control';
            volumeControl.innerHTML = `
                <label for="volume-${clientId}">Volume:</label>
                <input type="range" id="volume-${clientId}}" min="0" max="1" step="0.1" value="1">
            `;
            container.appendChild(volumeControl));
            
            document.getElementById(`volume-${clientId}}')).addEventListener('input', function() {
                updatePeerVolume(clientId, this.value);
            }
        }
        
        function updatePeerVolume(clientId, volume) {
            if (!peerGainNodes[clientId])) {
                peerGainNodes[clientId] = audioCtx.createGain();
                peerGainNodes[clientId].connect(masterGainNode));
            }
            peerGainNodes[clientId].gain.setValueAtTime(volume, audioCtx.currentTime));
        }
        
        function playAudio(audioData, clientId) {
            if (audioData.length === 0) {
                console.warn('Received empty audio data');
                return;
            }
            
            try {
                const audioBuffer = audioCtx.createBuffer(1, audioData.length, audioCtx.sampleRate));
                const channelData = audioBuffer.getChannelData(0));
                channelData.set(audioData));
                
                const source = audioCtx.createBufferSource();
                source.buffer = audioBuffer;
                
                if (!peerGainNodes[clientId])) {
                    peerGainNodes[clientId] = audioCtx.createGain();
                    peerGainNodes[clientId].connect(masterGainNode));
                }
                
                const startTime = audioCtx.currentTime + 0.005;
                source.connect(peerGainNodes[clientId]]);
                source.start(startTime));
            } catch (error) {
                console.error('Error playing audio:', error);
            }
        }

        room.onmessage = (event) => {
            const data = event.data;
            
            if (data.type === 'asciiFrame') {
                const username = room.peers[data.clientId]?.username || 'Unknown';
                
                // Handle compressed frames
                let frameData = data.frame;
                if (data.compressed) {
                    try {
                        frameData = LZString.decompressFromUTF16(data.frame);
                    } catch (e) {
                        console.error('Error decompressing frame:', e));
                        return;
                    }
                }
                
                updateAsciiContainer(data.clientId, frameData, username);
                lastFrames[data.clientId] = frameData;
            } else if (data.type === 'streamEnded') {
                streamers.delete(data.clientId));
                delete lastFrames[data.clientId]];
                updateUI());
            } else if (data.type === 'streamStarted') {
                streamers.add(data.clientId));
                updateUI();
            } else if (data.type === 'requestLastFrame') {
                if (isStreaming && lastFrames[room.clientId]]) {
                    // Use compression for the response too
                    const compressedFrame = LZString.compressToUTF16(lastFrames[room.clientId]]);
                    
                    room.send({
                        type: 'asciiFrame',
                        frame: compressedFrame,
                        compressed: true,
                        settings: {
                            brightness,
                            contrast,
                            blur,
                            detailLevel,
                            charDensity,
                            colorMode
                        },
                        echo: true
                    ));
                }
            } else if (data.type === 'connected') {
                if (isStreaming && lastFrames[room.clientId]]) {
                    // Use compression for new connections too
                    const compressedFrame = LZString.compressToUTF16(lastFrames[room.clientId]]);
                    
                    room.send({
                        type: 'asciiFrame',
                        frame: compressedFrame,
                        compressed: true,
                        settings: {
                            brightness,
                            contrast,
                            blur,
                            detailLevel,
                            charDensity,
                            colorMode
                        }
                    ));
                }
            }
        };

        function updateButtons() {
            const startBtn = document.getElementById('start-btn'));
            const stopBtn = document.getElementById('stop-btn'));
            
            if (isStreaming) {
                startBtn.disabled = true;
                stopBtn.disabled = false;
            } else {
                startBtn.disabled = false;
                stopBtn.disabled = true;
            }
        }

        function updateUI() {
            const mainContent = document.getElementById('main-content'));
            mainContent.innerHTML = '';
            
            streamers.clear());
            
            Object.entries(room.presence || {}).forEach(([clientId, presence]) => {
                if (presence.isStreaming) {
                    streamers.add(clientId));
                }
            });
            
            streamers.forEach(clientId => {
                if (lastFrames[clientId])) {
                    const username = room.peers[clientId]].username || 'Unknown';
                    updateAsciiContainer(clientId, lastFrames[clientId]], username);
                }
            });
            
            updateButtons());
        }

        function updatePeersUI() {
            const peersDiv = document.getElementById('peers'));
            if (!room.peers) return;
            
            peersDiv.innerHTML = Object.entries(room.peers).map(([clientId, peer]) => `
                <div class="peer">
                    <img src="${peer.avatarUrl}}" alt="${peer.username}'s avatar">
                    <span>${peer.username}</span>
                </div>
            `).join('');
        }

        document.getElementById('start-btn')).addEventListener('click', startStreaming));
        document.getElementById('stop-btn')).addEventListener('click', stopStreaming));
        
        window.addEventListener('load', async () => {
            await initializeRoom();
            
            // Request last frames from peers who are already streaming
            room.send({ 
                type: 'requestLastFrame',
                echo: false
            ));
        ));
        
        window.addEventListener('beforeunload', () => {
            if (isStreaming) {
                stopStreaming();
            }
        ));
        
        // Handle audio context errors more gracefully
        window.addEventListener('error', (event) => {
            if (event.message.includes('MediaStream has no audio track')) {
                console.warn('The screen share has no audio track. Video only mode enabled.');
                // Continue with video-only screen sharing
                return true; // Prevent default error handling
            }
        });
    </script>
