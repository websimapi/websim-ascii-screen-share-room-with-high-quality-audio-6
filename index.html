<html>
<head>
    <base href="https://example.com/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Screen Share Room with High-Quality Audio</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            background-color: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        #header {
            background-color: #2c2c2c;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #peers {
            display: flex;
            gap: 10px;
        }
        .peer {
            display: flex;
            align-items: center;
            background-color: #3a3a3a;
            padding: 5px 10px;
            border-radius: 15px;
        }
        .peer img {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            margin-right: 5px;
        }
        #main-content {
            flex-grow: 1;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            gap: 20px;
        }
        .ascii-container {
            white-space: pre;
            font-size: 4px;
            line-height: 1;
            background-color: #000;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            position: relative;
        }
        #controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        #volume-control, #image-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .peer-volume-control {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 5px;
        }
        .peer-volume-control label, #image-controls label {
            font-size: 12px;
        }
        .peer-volume-control input[type="range"], #image-controls input[type="range"] {
            width: 100px;
            -webkit-appearance: none;
            background: #ddd;
            outline: none;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        .peer-volume-control input[type="range"]:hover, #image-controls input[type="range"]:hover {
            opacity: 1;
        }
        .peer-volume-control input[type="range"]::-webkit-slider-thumb, #image-controls input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 15px;
            height: 15px;
            background: #4CAF50;
            cursor: pointer;
            border-radius: 50%;
        }
        .peer-volume-control input[type="range"]::-moz-range-thumb, #image-controls input[type="range"]::-moz-range-thumb {
            width: 15px;
            height: 15px;
            background: #4CAF50;
            cursor: pointer;
            border-radius: 50%;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
</head>
<body>
    <div id="header">
        <h1>ASCII Screen Share Room with High-Quality Audio</h1>
        <div id="peers"></div>
    </div>
    <div id="main-content"></div>
    <div id="controls">
        <button id="start-btn">Start Sharing</button>
        <button id="stop-btn" disabled>Stop Sharing</button>
        <div id="volume-control">
            <label for="volume">Master Volume:</label>
            <input type="range" id="volume" min="0" max="1" step="0.1" value="1">
        </div>
        <div id="image-controls">
            <label for="brightness">Brightness:</label>
            <input type="range" id="brightness" min="0" max="2" step="0.1" value="1">
            <label for="contrast">Contrast:</label>
            <input type="range" id="contrast" min="0" max="2" step="0.1" value="1">
            <label for="blur">Blur:</label>
            <input type="range" id="blur" min="0" max="10" step="0.5" value="0">
        </div>
    </div>

    <script>
        const room = new WebsimSocket();
        const asciiChars = ['@', '#', 'S', '%', '?', '*', '+', ';', ':', ',', '.'];
        const audioChars = ' ▁▂▃▄▅▆▇█';
        let isStreaming = false;
        let streamers = new Set();
        let lastFrames = {};

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const masterGainNode = audioCtx.createGain();
        masterGainNode.connect(audioCtx.destination);

        const AUDIO_BUFFER_SIZE = 16384;
        let audioBuffer = [];

        const peerGainNodes = {};

        let brightness = 1;
        let contrast = 1;
        let blur = 0;

        async function initializeRoom() {
            await room.initialize();
            
            room.subscribePresence((presence) => {
                updateUI();
            });
            
            room.updatePresence({
                isStreaming: false
            });
            
            updatePeersUI();
        }

        function smoothAudio(audioData) {
            const smoothingFactor = 0.1;
            let prevSample = 0;
            return audioData.map(sample => {
                const smoothedSample = prevSample + smoothingFactor * (sample - prevSample);
                prevSample = smoothedSample;
                return smoothedSample;
            });
        }

        function applyFade(audioData, fadeLength = 100) {
            for (let i = 0; i < fadeLength; i++) {
                const fadeFactor = i / fadeLength;
                audioData[i] *= fadeFactor;
                audioData[audioData.length - 1 - i] *= fadeFactor;
            }
            return audioData;
        }

        function encodeAudio(audioData) {
            const smoothedAudio = smoothAudio(audioData);
            const fadedAudio = applyFade(smoothedAudio);
            return fadedAudio.map(v => {
                const index = Math.min(Math.floor((Math.abs(v) * audioChars.length)), audioChars.length - 1);
                return audioChars[index];
            }).join('');
        }

        function decodeAudio(encodedAudio) {
            if (!encodedAudio) return new Float32Array(0);
            return new Float32Array(encodedAudio.split('').map(char => {
                const index = audioChars.indexOf(char);
                return (index / (audioChars.length - 1)) * 2 - 1;
            }));
        }

        function getAsciiFrame(imageData, width, height, audioData) {
            let asciiFrame = '';
            for (let y = 0; y < height; y += 2) {
                for (let x = 0; x < width; x++) {
                    const index = (y * width + x) * 4;
                    const brightness = (imageData[index] + imageData[index + 1] + imageData[index + 2]) / 3;
                    const charIndex = Math.floor(brightness / 25);
                    asciiFrame += asciiChars[charIndex] || ' ';
                }
                asciiFrame += '\n';
            }
            
            if (audioData && audioData.length > 0) {
                const encodedAudio = encodeAudio(audioData);
                asciiFrame += '\n' + encodedAudio;
            }
            
            return asciiFrame;
        }

        async function startStreaming() {
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                const video = document.createElement('video');
                video.srcObject = stream;
                await video.play();

                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 160;
                canvas.height = 120;

                isStreaming = true;
                
                room.updatePresence({
                    isStreaming: true
                });
                
                updateButtons();

                room.send({
                    type: 'streamStarted',
                    echo: true
                });

                const audioContext = new AudioContext();
                const source = audioContext.createMediaStreamSource(stream);
                const processor = audioContext.createScriptProcessor(4096, 1, 1);

                source.connect(processor);
                processor.connect(audioContext.destination);

                processor.onaudioprocess = (e) => {
                    const inputData = e.inputBuffer.getChannelData(0);
                    audioBuffer.push(...inputData);
                    
                    if (audioBuffer.length >= AUDIO_BUFFER_SIZE) {
                        sendFrame(video, canvas, ctx);
                    }
                };

                function sendFrame(video, canvas, ctx) {
                    ctx.filter = `brightness(${brightness}) contrast(${contrast}) blur(${blur}px)`;
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    ctx.filter = 'none';
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
                    
                    const audioData = audioBuffer.slice(0, AUDIO_BUFFER_SIZE);
                    audioBuffer = audioBuffer.slice(AUDIO_BUFFER_SIZE);
                    
                    const asciiFrame = getAsciiFrame(imageData, canvas.width, canvas.height, audioData);

                    room.send({
                        type: 'asciiFrame',
                        frame: asciiFrame,
                        echo: true
                    });

                    lastFrames[room.clientId] = asciiFrame;
                }

                setInterval(() => {
                    if (isStreaming && audioBuffer.length < AUDIO_BUFFER_SIZE) {
                        sendFrame(video, canvas, ctx);
                    }
                }, 100);

                stream.getVideoTracks()[0].onended = () => {
                    stopStreaming();
                };
            } catch (error) {
                console.error('Error accessing display media:', error);
                alert('Failed to start streaming. Please try again.');
            }
        }

        function stopStreaming() {
            isStreaming = false;
            
            room.updatePresence({
                isStreaming: false
            });
            
            updateButtons();
            
            room.send({ 
                type: 'streamEnded',
                echo: true
            });
        }

        document.getElementById('start-btn').addEventListener('click', startStreaming);
        document.getElementById('stop-btn').addEventListener('click', stopStreaming);

        function updateAsciiContainer(clientId, frame, username) {
            let container = document.getElementById(`ascii-${clientId}`);
            if (!container) {
                container = document.createElement('div');
                container.id = `ascii-${clientId}`;
                container.className = 'ascii-container';
                document.getElementById('main-content').appendChild(container);
            }
            
            const lines = frame.split('\n');
            const asciiData = lines.slice(0, -1).join('\n');
            const audioData = lines[lines.length - 1];
            
            const decodedAudio = decodeAudio(audioData);
            if (decodedAudio.length > 0) {
                playAudio(decodedAudio, clientId);
            }
            
            container.innerHTML = `${username}:<br>${frame}`;
            
            if (!container.querySelector('.peer-volume-control')) {
                const volumeControl = document.createElement('div');
                volumeControl.className = 'peer-volume-control';
                volumeControl.innerHTML = `
                    <label for="volume-${clientId}">Volume:</label>
                    <input type="range" id="volume-${clientId}" min="0" max="1" step="0.1" value="1">
                `;
                container.appendChild(volumeControl);
                
                document.getElementById(`volume-${clientId}`).addEventListener('input', function() {
                    updatePeerVolume(clientId, this.value);
                });
            }
        }

        function updatePeerVolume(clientId, volume) {
            if (!peerGainNodes[clientId]) {
                peerGainNodes[clientId] = audioCtx.createGain();
                peerGainNodes[clientId].connect(masterGainNode);
            }
            peerGainNodes[clientId].gain.setValueAtTime(volume, audioCtx.currentTime);
        }

        function playAudio(audioData, clientId) {
            if (audioData.length === 0) {
                console.warn('Received empty audio data');
                return;
            }

            const audioBuffer = audioCtx.createBuffer(1, audioData.length, audioCtx.sampleRate);
            const channelData = audioBuffer.getChannelData(0);
            channelData.set(audioData);

            const source = audioCtx.createBufferSource();
            source.buffer = audioBuffer;
            
            if (!peerGainNodes[clientId]) {
                peerGainNodes[clientId] = audioCtx.createGain();
                peerGainNodes[clientId].connect(masterGainNode);
            }
            
            const startTime = audioCtx.currentTime + 0.005;
            source.connect(peerGainNodes[clientId]);
            source.start(startTime);
        }

        room.onmessage = (event) => {
            const data = event.data;
            
            if (data.type === 'asciiFrame') {
                const username = room.peers[data.clientId]?.username || 'Unknown';
                updateAsciiContainer(data.clientId, data.frame, username);
                lastFrames[data.clientId] = data.frame;
            } else if (data.type === 'streamEnded') {
                streamers.delete(data.clientId);
                delete lastFrames[data.clientId];
                updateUI();
            } else if (data.type === 'streamStarted') {
                streamers.add(data.clientId);
                updateUI();
            } else if (data.type === 'requestLastFrame') {
                if (isStreaming) {
                    room.send({
                        type: 'asciiFrame',
                        frame: lastFrames[room.clientId],
                        echo: true
                    });
                }
            } else if (data.type === 'connected') {
                if (isStreaming) {
                    room.send({
                        type: 'asciiFrame',
                        frame: lastFrames[room.clientId],
                        echo: true
                    });
                }
            }
        };

        function updateButtons() {
            const startBtn = document.getElementById('start-btn');
            const stopBtn = document.getElementById('stop-btn');
            
            if (isStreaming) {
                startBtn.disabled = true;
                stopBtn.disabled = false;
            } else {
                startBtn.disabled = false;
                stopBtn.disabled = true;
            }
        }

        function updateUI() {
            const mainContent = document.getElementById('main-content');
            mainContent.innerHTML = '';
            
            streamers.clear();
            
            Object.entries(room.presence || {}).forEach(([clientId, presence]) => {
                if (presence.isStreaming) {
                    streamers.add(clientId);
                }
            });
            
            streamers.forEach(clientId => {
                if (lastFrames[clientId]) {
                    const username = room.peers[clientId]?.username || 'Unknown';
                    updateAsciiContainer(clientId, lastFrames[clientId], username);
                }
            });
            
            updateButtons();
        }

        function updatePeersUI() {
            const peersDiv = document.getElementById('peers');
            if (!room.peers) return;
            
            peersDiv.innerHTML = Object.entries(room.peers).map(([clientId, peer]) => `
                <div class="peer">
                    <img src="${peer.avatarUrl}" alt="${peer.username}'s avatar">
                    <span>${peer.username}</span>
                </div>
            `).join('');
        }

        document.getElementById('volume').addEventListener('input', function() {
            masterGainNode.gain.setValueAtTime(this.value, audioCtx.currentTime);
        });

        document.getElementById('brightness').addEventListener('input', function() {
            brightness = this.value;
        });

        document.getElementById('contrast').addEventListener('input', function() {
            contrast = this.value;
        });

        document.getElementById('blur').addEventListener('input', function() {
            blur = this.value;
        });

        window.addEventListener('load', async () => {
            await initializeRoom();
            
            room.send({ 
                type: 'requestLastFrame',
                echo: false
            });
        });

        window.addEventListener('beforeunload', () => {
            if (isStreaming) {
                stopStreaming();
            }
        });
    </script>

</body>
